app:
  environment: development
  host: 127.0.0.1
  port: 8080
  timezone: Asia/Shanghai
  log_level: INFO
  database_path: data/neoqbot.db
  # 开启“记录”后，群消息按 Bot/群号/日期写入 JSONL；Docker 中位于持久化数据卷。
  message_archive_path: data/group-message-records
  # 生产环境请通过 NEOQBOT_APP__ADMIN_API_TOKEN 注入随机长令牌。
  admin_api_token: ""
  # Docker 初始化服务会自动生成；文件内容优先于上面的明文值。
  admin_api_token_file: data/secrets/admin-api.token
  # 首次联调务必保持 true；确认收发链路后再关闭。
  dry_run: true
  # 只允许这些 Host Header。通过域名访问时必须加入实际域名。
  allowed_hosts: [localhost, 127.0.0.1, neoqbot]
  # 允许通过服务器 IP 字面量访问；不会放行任意域名。
  allow_ip_hosts: true
  # 可选管理端 IP/CIDR 白名单；留空时依赖本机端口绑定、VPN 或反向代理访问控制。
  management_allowed_networks: []
  # 通过可信 HTTPS 反向代理公开管理端时改为 true。
  require_https: false
  # 仅信任这些地址发送的 X-Forwarded-*；不要在公网环境填写 *。
  forwarded_allow_ips: 127.0.0.1
  max_request_body_bytes: 2097152
  # 公网部署不要公开 OpenAPI/Swagger 文档。
  expose_api_docs: false

qq:
  # 内置 NapCat 统一上报到 /webhooks/onebot；外部实例可使用 /webhooks/onebot/<bot-id>。
  bots:
    - id: default
      name: 默认 QQ Bot
      enabled: false
      # Compose 内置 NapCat 只能由一个 Bot 使用；其他账号改为 external 并配置独立实例。
      connection_mode: bundled_napcat
      # Compose 内使用服务名；Windows 本地直连外部 NapCat 时可改为 http://127.0.0.1:3000。
      onebot_base_url: http://qq-bridge:3000
      # Compose 自动生成随机 Token 并写入持久卷；文件存在时优先于明文值。
      access_token: ""
      access_token_file: data/secrets/napcat-onebot.token
      webhook_secret: ""
      request_timeout_seconds: 15
      webui_base_url: http://qq-bridge:6099
      webui_token: ""
      webui_token_file: data/secrets/napcat-webui.token
      webui_public_url: ""
      webui_public_port: 6099
      qrcode_path: /app/napcat-cache/qrcode.png
      administrator_qq_ids: ["10001"]
      # 管理群：notify_administrators 会把同一消息同时发到这些群；留空则不发群消息。
      management_group_ids: []
      announcement_actions: [get_group_notice, _get_group_notice]
      search_feishu_bot_id: ""

llm:
  # rules 可离线联调；生产建议切到 openai_compatible 并配置 Agnes AI。
  driver: rules
  base_url: https://your-agnes-endpoint.example/v1
  api_key: ""
  model: your-agnes-model
  timeout_seconds: 60
  temperature: 0
  max_retries: 2
  # 如果 Agnes 端点不接受 OpenAI response_format 参数，改为 false。
  json_response_format: true

join_approval:
  enabled: false
  # 首次上线保持 false，观察审核日志后再开启。
  auto_approve: false
  auto_reject: false
  minimum_confidence: 0.88
  policy: >-
    申请者必须说明加入目的、所在服务器或组织，并明确同意群规。内容模糊、身份无法
    判断、疑似广告或规避审核时转人工。不得根据性别、地域等无关个人属性作决定。
  required_keywords:
    - 同意群规
  forbidden_keywords:
    - 代充
    - 刷单

moderation:
  enabled: false
  interval_minutes: 30
  window_minutes: 5
  risk_threshold: 0.7
  max_messages_per_run: 300
  policy: >-
    识别违法违规、涉政、色情、仇恨或群体对立、人身攻击、骚扰、诈骗、泄露隐私及
    其他违反群规的内容。结合上下文，普通新闻讨论、反驳违规观点或引用不得仅凭关键
    词判违规。机器人只通知管理员，不自动禁言或踢人。
  # 仅供 rules 离线模式联调；真实生产请依赖模型复核上下文。
  rule_keywords:
    scam:
      - 刷单
      - 返利
    harassment:
      - 人肉

announcements:
  enabled: false
  sync_interval_minutes: 30

feishu:
  bots:
    - id: default
      name: 默认飞书 Bot
      enabled: false
      driver: disabled
      # 填写当前飞书 CLI 的实际可执行文件。
      executable: feishu
      timeout_seconds: 60
      search_prefixes: ["搜索 ", "查询 ", "/search "]
      max_search_results: 5
      # 模板只填写 executable 后面的参数；每项是独立 argv，不经过 shell。
      command_templates: {}
      archive_payload_stdin: false
      # 多飞书账号可分别设置 HOME/配置目录等变量来隔离 CLI 登录态。
      extra_environment: {}

orchestration:
  # 资源支持 qq_group、feishu_group、knowledge_base；画布坐标保存在 layout。
  resources:
    - id: qq-group-main
      kind: qq_group
      name: 主群
      external_id: "123456789"
      description: ""
      enabled: true
      metadata: {}
  edges:
    - id: default-manages-main
      source: qq-bot:default
      target: qq-group-main
      relation: manages
      enabled: true
      # 事务属于这条 Bot→群连接。同一 Bot 连接其他群时可使用完全不同的任务组合。
      tasks:
        join_management:
          enabled: false
          detect_requests: false
          execute_management: false
          auto_approve: false
          auto_reject: false
          minimum_confidence: 0.88
        message_detection:
          enabled: false
          record: false
          scheduled_analysis: false
          interval_minutes: 30
          window_minutes: 5
          risk_threshold: 0.7
          max_messages_per_run: 300
        announcement_sync:
          enabled: false
          sync_interval_minutes: 30
          feishu_bot_id: ""
  layout: {}

runtime:
  event_workers: 2
  shutdown_grace_seconds: 15

retention:
  enabled: true
  message_days: 30
  join_request_days: 180
  moderation_run_days: 365
  audit_days: 365

gui:
  enabled: true
  bootstrap_username: admin
  bootstrap_password: ""
  # Docker 初始化服务生成随机初始密码；首次登录后立即修改。
  bootstrap_password_file: data/secrets/gui-bootstrap-password
  session_hours: 8
  max_sessions_per_user: 5
  # 直接 HTTP 访问时保持 false；经 HTTPS 反向代理后改为 true。
  secure_cookie: false
  # 默认禁止 GUI 修改主机、鉴权、可执行文件和连接端点等高风险部署字段。
  allow_sensitive_settings_edits: false
